<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">Una sala, una foto distinta para cada jugador</title>
  <desc id="d">La misma partida de El impostor. El servidor sabe la palabra y quién es el impostor. A los jugadores normales les envía la palabra; al impostor, solo la categoría. Ninguna respuesta lleva el rol de los demás, así que mirar la red del navegador no sirve para hacer trampas.</desc>
  <style>
    .h { font-family: 'Arial Black', 'Archivo Black', Impact, Helvetica, Arial, sans-serif; font-weight: 900; }
    .b { font-family: Helvetica, Arial, sans-serif; font-weight: 700; }
    .r { font-family: Helvetica, Arial, sans-serif; }
    .m { font-family: Consolas, 'Courier New', monospace; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="#d9b8ff"/>

  <!-- Servidor -->
  <rect x="48" y="88" width="300" height="290" rx="20" fill="#111"/>
  <rect x="40" y="80" width="300" height="290" rx="20" fill="#fff" stroke="#111" stroke-width="5"/>
  <text x="62" y="118" class="h" font-size="20" fill="#111">LO QUE SABE</text>
  <text x="62" y="144" class="h" font-size="20" fill="#111">LA BASE DE DATOS</text>
  <text x="62" y="186" class="m" font-size="16" fill="#111">palabra:   "gato"</text>
  <text x="62" y="212" class="m" font-size="16" fill="#111">categoría: "animales"</text>
  <text x="62" y="238" class="m" font-size="16" fill="#111">Fran:  jugador</text>
  <text x="62" y="264" class="m" font-size="16" fill="#111">Lucía: jugador</text>
  <text x="62" y="290" class="m" font-size="16" fill="#ff6b5e" font-weight="700">Marta: impostor</text>
  <text x="62" y="316" class="m" font-size="16" fill="#111">votos: Fran → Marta</text>
  <text x="62" y="350" class="r" font-size="14" fill="#111">Nunca sale entero de aquí.</text>

  <g stroke="#111" stroke-width="5" fill="none" marker-end="url(#a)">
    <path d="M344 160 C 420 160, 430 110, 492 110"/>
    <line x1="344" y1="225" x2="492" y2="225"/>
    <path d="M344 290 C 420 290, 430 340, 492 340"/>
  </g>

  <!-- Fotos -->
  <g>
    <rect x="506" y="76" width="340" height="72" rx="16" fill="#111"/>
    <rect x="500" y="70" width="340" height="72" rx="16" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="518" y="98" class="b" font-size="16" fill="#111">Foto de Fran</text>
    <text x="518" y="124" class="m" font-size="14" fill="#111">{ palabra: "gato", rol: "jugador" }</text>
  </g>
  <g>
    <rect x="506" y="196" width="340" height="72" rx="16" fill="#111"/>
    <rect x="500" y="190" width="340" height="72" rx="16" fill="#fff" stroke="#111" stroke-width="4"/>
    <text x="518" y="218" class="b" font-size="16" fill="#111">Foto de Lucía</text>
    <text x="518" y="244" class="m" font-size="14" fill="#111">{ palabra: "gato", rol: "jugador" }</text>
  </g>
  <g>
    <rect x="506" y="316" width="340" height="72" rx="16" fill="#ff6b5e"/>
    <rect x="500" y="310" width="340" height="72" rx="16" fill="#111" stroke="#111" stroke-width="4"/>
    <text x="518" y="338" class="b" font-size="16" fill="#ffd23f">Foto de Marta</text>
    <text x="518" y="364" class="m" font-size="14" fill="#fff">{ categoría: "animales", rol: "impostor" }</text>
  </g>

  <!-- Nota -->
  <rect x="886" y="96" width="282" height="270" rx="20" fill="#111"/>
  <rect x="880" y="90" width="282" height="270" rx="20" fill="#ffd23f" stroke="#111" stroke-width="5"/>
  <text x="898" y="128" class="h" font-size="20" fill="#111">NI ABRIENDO LAS</text>
  <text x="898" y="154" class="h" font-size="20" fill="#111">HERRAMIENTAS</text>
  <text x="898" y="194" class="r" font-size="16" fill="#111">Ninguna foto lleva el rol</text>
  <text x="898" y="216" class="r" font-size="16" fill="#111">ajeno, los votos de otros</text>
  <text x="898" y="238" class="r" font-size="16" fill="#111">ni el recuento antes de</text>
  <text x="898" y="260" class="r" font-size="16" fill="#111">tiempo. Lo que no llega</text>
  <text x="898" y="282" class="r" font-size="16" fill="#111">al móvil no se puede</text>
  <text x="898" y="304" class="r" font-size="16" fill="#111">espiar. Las pruebas e2e</text>
  <text x="898" y="326" class="r" font-size="16" fill="#111">revisan el tráfico de red.</text>
</svg>
